plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.15'
}

version = '0.9.0'

nextflowPlugin {
    // 25.04.0 is the supported floor; CI overrides via NXF_VER to also
    // exercise newer lines (e.g. 26.x, which defaults to the v2 strict
    // parser) and catch internal-API drift early.
    nextflowVersion = System.getenv('NXF_VER') ?: '25.04.0'

    provider = 'nextflow'
    className = 'io.seqera.nf.diff.DiffPlugin'
    // nf-diff's primary interface is a CLI verb (`nextflow plugin nf-diff:diff`).
    // It also registers a trace-observer factory so that, when a pipeline sets
    // `diff.archive.enabled = true`, each run is archived to a central store on
    // completion (see DiffObserverFactory). The factory is inert unless that
    // option is set, so the extension point adds no overhead by default.
    extensionPoints = [
            'io.seqera.nf.diff.DiffObserverFactory',
    ]
}
