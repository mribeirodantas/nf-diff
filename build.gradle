plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.10'
}

version = '0.4.0'

nextflowPlugin {
    // 25.04.0 is the supported floor; CI overrides via NXF_VER to also
    // exercise newer lines (e.g. 26.x, which defaults to the v2 strict
    // parser) and catch internal-API drift early.
    nextflowVersion = System.getenv('NXF_VER') ?: '25.04.0'

    provider = 'nextflow'
    className = 'io.seqera.nf.diff.DiffPlugin'
    // nf-diff exposes a CLI verb (`nextflow plugin nf-diff:diff`) rather than
    // pipeline extension points, so no extensionPoints are declared here.
    extensionPoints = []
}
