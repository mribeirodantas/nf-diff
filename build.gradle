plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.10'
}

version = '0.1.0'

nextflowPlugin {
    nextflowVersion = '25.04.0'

    provider = 'seqera'
    className = 'io.seqera.nf.diff.DiffPlugin'
    // nf-diff exposes a CLI verb (`nextflow plugin nf-diff:diff`) rather than
    // pipeline extension points, so no extensionPoints are declared here.
    extensionPoints = []
}
