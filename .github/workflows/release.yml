name: Release

# Publish the plugin to the Nextflow plugin registry when a version tag is
# pushed (e.g. `git tag v0.2.0 && git push origin v0.2.0`).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Publish to Nextflow plugin registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Guard against a mismatch between the pushed tag and build.gradle's
      # version, so a tag can never publish a differently-numbered artifact.
      - name: Verify tag matches build.gradle version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION=$(awk -F"'" '/^version[[:space:]]*=/{print $2}' build.gradle)
          echo "tag=$TAG build.gradle=$GRADLE_VERSION"
          if [ "$TAG" != "$GRADLE_VERSION" ]; then
            echo "::error::Tag v$TAG does not match build.gradle version $GRADLE_VERSION"
            exit 1
          fi

      # Never publish a red build: run the full check suite first.
      - name: Compile + test + checks
        run: make check

      - name: Publish plugin
        # The Nextflow Gradle plugin's releasePlugin task reads the registry
        # token from NPR_API_KEY (falls back to the npr.apiKey Gradle property),
        # and the registry URL from NPR_API_URL (default
        # https://registry.nextflow.io/api).
        env:
          NPR_API_KEY: ${{ secrets.NPR_API_KEY }}
        run: make release
