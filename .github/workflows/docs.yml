name: Docs site

# Builds the Astro + Starlight site in website/ and publishes it to the
# gh-pages branch. Builds /latest/ and all defined version snapshots
# (e.g. /0.6.0/, /0.5.0/) so versioned docs stay reachable.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - 'examples/rich-report/**'
      - '.github/workflows/docs.yml'
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: docs-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build all versions
        run: npm run build:all

      - name: Upload site output
        uses: actions/upload-artifact@v4
        with:
          name: site-output
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download site output
        uses: actions/download-artifact@v4
        with:
          name: site-output
          path: dist

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          keep_files: true
