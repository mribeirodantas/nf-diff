name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  check:
    name: check (JDK ${{ matrix.java }}, NF ${{ matrix.nextflow }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # nf-diff requires Java 17+; also exercise the current LTS (21).
        java: ['17', '21']
        # 25.04.0 is the supported floor; 26.04.0 makes the v2 strict parser
        # the default and touches CLI/plugin surfaces, so exercise both to
        # catch drift in the internal APIs the plugin reuses (HistoryFile,
        # CacheDB, DefaultCacheStore, ConfigBuilder).
        nextflow: ['25.04.0', '26.04.0']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile + test + checks
        env:
          # build.gradle reads NXF_VER to override the plugin's Nextflow
          # version; unset it falls back to the 25.04.0 floor.
          NXF_VER: ${{ matrix.nextflow }}
        run: make check

      - name: Install Nextflow ${{ matrix.nextflow }}
        env:
          # get.nextflow.io honours NXF_VER, so the runtime binary matches the
          # version the plugin was compiled against in the step above.
          NXF_VER: ${{ matrix.nextflow }}
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - name: End-to-end smoke test
        env:
          NXF_VER: ${{ matrix.nextflow }}
        run: make smoke

      - name: Upload test reports
        # Fork PRs get a read-only token, so artifact finalize always 403s there.
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.java }}-nf${{ matrix.nextflow }}
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 7
