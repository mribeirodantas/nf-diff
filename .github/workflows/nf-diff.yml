name: nf-diff (dogfood)

# Exercises this repo's own composite action end-to-end: generate two real
# Nextflow runs from a trivial demo pipeline, then compare them with the local
# action (`uses: ./`).
#
# NOTE: the action resolves nf-diff from registry.nextflow.io, so this job
# validates the *action wiring* against the published plugin — not the
# working-tree build. The unit suite (`make check`) and `make smoke` cover the
# current source; keep this as an integration check for action.yml itself.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # required for the PR comment

concurrency:
  group: nf-diff-dogfood-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dogfood:
    name: Compare two demo runs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2

      - name: Produce two demo runs
        run: |
          set -euo pipefail
          mkdir -p demo
          cd demo
          # A trivial pipeline that stays valid under the v2 strict parser
          # (no implicit `it`, explicit channel factory). Mirrors e2e/smoke.sh.
          cat > main.nf <<'NF'
          process SAY {
              input:
              val message

              output:
              path 'out.txt'

              script:
              """
              echo "${message}" > out.txt
              # TEMP: deliberately fail to exercise the failure log-artifact steps
              echo "Simulating a task failure for CI testing" >&2
              exit 1
              """
          }

          workflow {
              SAY(channel.of(params.message))
          }
          NF

          printf '%s\n' 'lineage.enabled = true' > lineage.config

          # Two runs that differ only in a pipeline param, so nf-diff has a
          # meaningful change to report.
            nextflow run main.nf -c lineage.config --message hello
            nextflow run main.nf -c lineage.config --message world

      - name: Run nf-diff on the two demo runs
        uses: ./
        with:
          dir: demo
          last: 'true'
          format: md
          comment-pr: 'true'
          # Nextflow + JDK are already installed above.
          setup-java: 'false'
          setup-nextflow: 'false'
          # The two runs intentionally differ; don't fail the dogfood job on it.
          fail-on-change: 'false'

      # 2b. On failure, collect logs and upload as a downloadable artifact
      - name: Collect logs on failure
        if: failure()
        working-directory: demo
        run: |
          mkdir -p pipeline-logs
          # Top-level Nextflow log
          cp -f .nextflow.log pipeline-logs/ 2>/dev/null || true
          # Per-task command logs, flattened with the work hash in the filename
          find work -type f \( -name '.command.log' -o -name '.command.err' -o -name '.command.out' \) 2>/dev/null | while read -r f; do
            hash=$(basename "$(dirname "$f")")
            cp -f "$f" "pipeline-logs/${hash}_$(basename "$f")"
          done

      - name: Upload logs artifact
        if: failure()
        id: upload-logs
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: demo/pipeline-logs
          if-no-files-found: warn
          retention-days: 14

      # 2c. On failure, post/update a sticky PR comment linking to the logs
      - name: Comment on PR with failure logs link
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactUrl = `${{ steps.upload-logs.outputs.artifact-url }}`;
            const marker = '<!-- nf-diff-failure -->';
            const body = [
              marker,
              '### ❌ nf-diff dogfood run failed',
              '',
              'The demo pipeline run did not complete, so no diff could be produced.',
              '',
              `📦 **Logs:** \`pipeline-logs-${context.runId}\`` +
                (artifactUrl ? ` — [download](${artifactUrl})` : ''),
              `🔎 **Run summary:** [view logs & artifacts](${runUrl})`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
