name: nf-diff (dogfood)

# Exercises this repo's own composite action end-to-end: generate two real
# Nextflow runs from a trivial demo pipeline, then compare them with the local
# action (`uses: ./`).
#
# The plugin is built from THIS checkout (`make dev-repo`) and exposed to every
# later step through NXF_PLUGINS_TEST_REPOSITORY, so the action's bare-id
# `nextflow plugin nf-diff:diff` call resolves the branch build rather than the
# release on registry.nextflow.io. A verification step then fails the job
# unless the loaded plugin is byte-identical to the build output, so the PR
# comment always reflects the code under review (#38).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # required for the PR comment

concurrency:
  group: nf-diff-dogfood-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dogfood:
    name: Compare two demo runs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2

      - name: Build the plugin from this checkout
        run: |
          set -euo pipefail
          # Assemble the plugin and write a local plugin repo (plugins.json +
          # zip) advertising this build's version, exactly as `make smoke` does.
          make dev-repo
          version="$(awk -F"'" '/^version[[:space:]]*=/{print $2}' build.gradle)"
          echo "NF_DIFF_VERSION=${version}" >> "$GITHUB_ENV"
          # Every later step (including the composite action) resolves the bare
          # `nf-diff` id from this repo instead of the public registry.
          echo "NXF_PLUGINS_TEST_REPOSITORY=file://${GITHUB_WORKSPACE}/build/plugin-repo/plugins.json" >> "$GITHUB_ENV"
          # Nextflow reuses an already-extracted plugin of the same version, so
          # replace any copy (e.g. from a cached home) with this build, extracted
          # in place. The test repository alone is not enough: when this version
          # is also published, Nextflow can install the registry copy instead.
          plugins_dir="${NXF_HOME:-$HOME/.nextflow}/plugins"
          rm -rf "${plugins_dir}/nf-diff-"*
          mkdir -p "${plugins_dir}/nf-diff-${version}"
          unzip -q "build/distributions/nf-diff-${version}.zip" -d "${plugins_dir}/nf-diff-${version}"
          echo "Built nf-diff ${version} from $(git rev-parse --short HEAD)"

      - name: Produce two demo runs
        run: |
          set -euo pipefail
          mkdir -p demo
          cd demo
          # A trivial pipeline that stays valid under the v2 strict parser
          # (no implicit `it`, explicit channel factory). Mirrors e2e/smoke.sh.
          cat > main.nf <<'NF'
          process SAY {
              input:
              val message

              output:
              path 'out.txt'

              script:
              """
              echo "${message}" > out.txt
              """
          }

          workflow {
              SAY(channel.of(params.message))
          }
          NF

          printf '%s\n' 'lineage.enabled = true' > lineage.config

          # Two runs that differ only in a pipeline param, so nf-diff has a
          # meaningful change to report.
          nextflow run main.nf -c lineage.config --message hello
          nextflow run main.nf -c lineage.config --message world

      - name: Run nf-diff on the two demo runs
        uses: ./
        with:
          dir: demo
          last: 'true'
          format: md
          comment-pr: 'true'
          # Nextflow + JDK are already installed above.
          setup-java: 'false'
          setup-nextflow: 'false'
          # The two runs intentionally differ; don't fail the dogfood job on it.
          fail-on-change: 'false'

      - name: Verify the branch build was used
        run: |
          set -euo pipefail
          plugin_dir="${NXF_HOME:-$HOME/.nextflow}/plugins/nf-diff-${NF_DIFF_VERSION}"
          jar="build/libs/nf-diff-${NF_DIFF_VERSION}.jar"
          echo "Loaded plugin: ${plugin_dir}"
          if [[ ! -d "$plugin_dir" ]]; then
            echo "::error::nf-diff ${NF_DIFF_VERSION} was not extracted to ${plugin_dir}"
            exit 1
          fi
          manifest="$(find "$plugin_dir" -path '*META-INF/MANIFEST.MF' | head -n 1)"
          grep -E '^Plugin-(Id|Version):' "$manifest"
          # Fingerprint the plugin's own classes on both sides; any difference
          # means Nextflow loaded something other than this checkout's build.
          fingerprint() { (cd "$1" && find io -type f -name '*.class' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1); }
          loaded_root="$(dirname "$(dirname "$manifest")")"
          built_root="$(mktemp -d)"
          unzip -q "$jar" -d "$built_root"
          loaded="$(fingerprint "$loaded_root")"
          built="$(fingerprint "$built_root")"
          echo "classes fingerprint  loaded: ${loaded}"
          echo "classes fingerprint  built:  ${built}"
          if [[ "$loaded" != "$built" ]]; then
            echo "::error::The dogfood run loaded an nf-diff plugin that differs from this checkout's build (published registry copy?)."
            exit 1
          fi
          {
            echo "### nf-diff dogfood: plugin under test"
            echo "- version: \`${NF_DIFF_VERSION}\` built from \`$(git rev-parse --short HEAD)\`"
            echo "- loaded from: \`${plugin_dir}\`"
            echo "- classes fingerprint: \`${loaded}\` (matches \`${jar}\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      # 2b. On failure, collect logs and upload as a downloadable artifact
      - name: Collect logs on failure
        if: failure()
        working-directory: demo
        run: |
          mkdir -p pipeline-logs
          # Top-level Nextflow log
          cp -f .nextflow.log pipeline-logs/ 2>/dev/null || true
          # Per-task command logs, flattened with the work hash in the filename
          find work -type f \( -name '.command.log' -o -name '.command.err' -o -name '.command.out' \) 2>/dev/null | while read -r f; do
            hash=$(basename "$(dirname "$f")")
            cp -f "$f" "pipeline-logs/${hash}_$(basename "$f")"
          done

      - name: Upload logs artifact
        if: failure()
        id: upload-logs
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: demo/pipeline-logs
          if-no-files-found: warn
          retention-days: 14

      # 2c. On failure, post/update a sticky PR comment linking to the logs
      - name: Comment on PR with failure logs link
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactUrl = `${{ steps.upload-logs.outputs.artifact-url }}`;
            const marker = '<!-- nf-diff-failure -->';
            const body = [
              marker,
              '### ❌ nf-diff dogfood run failed',
              '',
              'The demo pipeline run did not complete, so no diff could be produced.',
              '',
              `📦 **Logs:** \`pipeline-logs-${context.runId}\`` +
                (artifactUrl ? ` — [download](${artifactUrl})` : ''),
              `🔎 **Run summary:** [view logs & artifacts](${runUrl})`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
